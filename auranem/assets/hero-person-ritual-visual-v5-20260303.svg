<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Person in morning ritual with AURANEM</title>
  <desc id="desc">Editorial morning kitchen scene with person holding water glass and AURANEM product in foreground.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="1" stop-color="#e4dccb"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef6df"/>
      <stop offset="1" stop-color="#f0dfb7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="250" cy="180" r="140" fill="url(#sun)" opacity=".8" filter="url(#soft)"/>
  <rect x="0" y="560" width="1400" height="340" fill="#d8ccb5"/>
  <rect x="760" y="180" width="420" height="380" rx="18" fill="#efe6d6"/>
  <rect x="805" y="228" width="330" height="18" rx="9" fill="#d7cbb4"/>
  <rect x="820" y="268" width="300" height="12" rx="6" fill="#c7baa0"/>
  <rect x="820" y="300" width="260" height="12" rx="6" fill="#c7baa0"/>

  <ellipse cx="560" cy="620" rx="170" ry="26" fill="#9e8f77" opacity=".25"/>
  <ellipse cx="960" cy="690" rx="210" ry="30" fill="#8f7f66" opacity=".25"/>

  <g transform="translate(360 210)">
