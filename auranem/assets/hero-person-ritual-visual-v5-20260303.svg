    <path d="M113 110c5-56 22-89 75-95 40 4 64 30 73 72-26-25-52-36-84-37-22 9-42 27-64 60z" fill="#5d4c3f"/>
    <rect x="95" y="170" width="190" height="250" rx="32" fill="#b8c1ad"/>
    <rect x="125" y="225" width="130" height="170" rx="24" fill="#c8d0be"/>
    <rect x="250" y="220" width="75" height="42" rx="20" fill="#d6b297"/>
    <rect x="302" y="228" width="46" height="70" rx="18" fill="#d6b297"/>
    <rect x="326" y="260" width="44" height="88" rx="22" fill="#f5f2eb"/>
