    <rect x="12" y="52" width="196" height="146" rx="14" fill="#efe7d6"/>
    <text x="110" y="100" text-anchor="middle" font-family="Manrope, Arial" font-size="20" fill="#61533f" letter-spacing="2">AURANEM</text>
    <text x="110" y="128" text-anchor="middle" font-family="Manrope, Arial" font-size="14" fill="#7d6c54">DAILY BALANCE</text>
