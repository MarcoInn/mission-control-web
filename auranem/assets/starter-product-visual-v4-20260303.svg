<svg width="1100" height="700" viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Clean, bright product photography style -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2EBE0"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="15" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>

    <!-- Amber Glass -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F1B0C"/> 
      <stop offset="20%" stop-color="#5C3A21"/> 
      <stop offset="50%" stop-color="#3E2716"/> 
      <stop offset="85%" stop-color="#2F1B0C"/> 
    </linearGradient>

    <!-- Label -->
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2EBE0"/>
      <stop offset="15%" stop-color="#FFF9F0"/> 
      <stop offset="50%" stop-color="#F2EBE0"/> 
      <stop offset="85%" stop-color="#E6DCCF"/> 
    </linearGradient>

    <!-- Cap -->
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2E26"/>
      <stop offset="15%" stop-color="#2C4A3E"/>
      <stop offset="50%" stop-color="#1A2E26"/>
      <stop offset="90%" stop-color="#0F1C17"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="700" fill="url(#bg)"/>

  <!-- JAR GROUP (Reusable) -->
  <g id="jar-single" transform="translate(550, 350) scale(0.9)">
    <!-- Shadow -->
    <ellipse cx="0" cy="240" rx="140" ry="30" fill="#000" opacity="0.15" filter="url(#shadow)"/>

    <!-- Body -->
    <rect x="-110" y="-180" width="220" height="400" rx="18" fill="url(#glass)"/>

    <!-- Label -->
    <rect x="-112" y="-60" width="224" height="240" rx="4" fill="url(#label)"/>

    <!-- Branding -->
    <text x="0" y="20" font-family="serif" font-weight="bold" font-size="24" fill="#1A2E26" text-anchor="middle" letter-spacing="1.5">AURANEM</text>
    <text x="0" y="50" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle" letter-spacing="0.5">DAILY BALANCE</text>
    
    <rect x="-40" y="80" width="80" height="1" fill="#C5A065"/>

    <!-- Cap -->
    <rect x="-115" y="-220" width="230" height="50" rx="4" fill="url(#cap)"/>
    
    <!-- Reflections -->
    <rect x="-90" y="-220" width="30" height="400" fill="#FFFFFF" opacity="0.04"/>
  </g>
  
  <!-- "Starter" Badge hint -->
  <text x="550" y="650" font-family="sans-serif" font-size="14" fill="#999" text-anchor="middle" letter-spacing="1">STARTER EDITION</text>
</svg>