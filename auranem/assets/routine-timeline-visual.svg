<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Routine Timeline Visual</title>
<desc id="d">4-Phasen-Zeitleiste für den 30-Tage-Routinenaufbau.</desc>
<rect width="1200" height="420" rx="24" fill="#FFFFFF"/>
<path d="M130 210H1070" stroke="#A6BFB2" stroke-width="8" stroke-linecap="round"/>
<g font-family="Arial" fill="#25483D">
<circle cx="190" cy="210" r="34" fill="#EAF2ED" stroke="#89A999" stroke-width="4"/>
<text x="190" y="217" text-anchor="middle" font-size="16" font-weight="700">Tag 1</text>
<text x="190" y="278" text-anchor="middle" font-size="19" font-weight="700">Start</text>
<text x="190" y="304" text-anchor="middle" font-size="15">Setup fixieren</text>

<circle cx="470" cy="210" r="34" fill="#EAF2ED" stroke="#89A999" stroke-width="4"/>
<text x="470" y="217" text-anchor="middle" font-size="16" font-weight="700">W1</text>
<text x="470" y="278" text-anchor="middle" font-size="19" font-weight="700">Rhythmus</text>
<text x="470" y="304" text-anchor="middle" font-size="15">Gewohnheit bauen</text>

<circle cx="750" cy="210" r="34" fill="#EAF2ED" stroke="#89A999" stroke-width="4"/>
