<text x="80" y="78" font-family="Arial" font-size="34" fill="#18382f">Echte Nachweise statt Hype</text>
<g font-family="Arial">
<rect x="80" y="120" width="330" height="320" rx="16" fill="#fff" stroke="#dfd2bf"/>
<text x="110" y="168" font-size="22" fill="#18382f">Formate</text>
<text x="110" y="206" font-size="15" fill="#335549">• Verifizierte Kundenfragen (FAQ)</text>
<text x="110" y="238" font-size="15" fill="#335549">• Qualitätskennzeichen / Batch-ID</text>
<text x="110" y="270" font-size="15" fill="#335549">• Klare Starter vs Plus Facts</text>
<text x="110" y="302" font-size="15" fill="#335549">• Routinedaten statt Heilaussagen</text>

<rect x="435" y="120" width="330" height="320" rx="16" fill="#fff" stroke="#dfd2bf"/>
